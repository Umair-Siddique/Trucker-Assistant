name: trucker_assistant_flutter
description: RoadDogg AI Assistant
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.2.3

  record: ^6.2.0
  just_audio: ^0.9.40
  speech_to_text: ^7.3.0

  geolocator: ^14.0.2
  google_maps_flutter: ^2.13.1
  flutter_dotenv: ^5.2.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  openai_realtime_dart: ^0.1.4
  audio_session: ^0.1.25
  flutter_tts: ^4.2.5
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_logo.jpeg

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/animations/
    - .env